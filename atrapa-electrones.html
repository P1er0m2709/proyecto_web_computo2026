<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ElectroBot - Atrapa Electrones</title>
    <link rel="stylesheet" href="css/style.css">

    <style>
        .electron-container {
            max-width: 700px;
            margin: 35px auto;
            padding: 20px;
            text-align: center;
        }

        h1 {
            color: #16a34a;
        }

        .game-area {
            position: relative;
            height: 420px;
            background: #0f172a;
            border: 5px solid #22c55e;
            border-radius: 15px;
            overflow: hidden;
            margin-top: 25px;
        }

        .player {
            position: absolute;
            width: 35px;
            height: 35px;
            border-radius: 50%;
            background: #38bdf8;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
        }

        .electron {
            position: absolute;
            width: 25px;
            height: 25px;
            border-radius: 50%;
            background: #facc15;
            box-shadow: 0 0 15px #facc15;
        }

        .obstacle {
            position: absolute;
            width: 90px;
            height: 25px;
            background: #ef4444;
            border-radius: 8px;
        }

        .message {
            min-height: 30px;
            font-weight: bold;
            font-size: 18px;
        }

        .button {
            padding: 12px 20px;
            border: none;
            border-radius: 10px;
            background: #16a34a;
            color: white;
            cursor: pointer;
            font-weight: bold;
        }

        .controls {
            margin-top: 20px;
        }

        .control {
            padding: 12px 18px;
            margin: 4px;
            border: none;
            border-radius: 8px;
            background: #16a34a;
            color: white;
            cursor: pointer;
            font-size: 18px;
        }
    </style>
</head>

<body>

<header class="navbar">
    <div class="logo">⚡ ElectroBot</div>

    <nav>
        <a href="index.html">Inicio</a>
        <a href="minijuegos.html">Minijuegos</a>
    </nav>
</header>

<main class="electron-container">
    <h1>⚡ Atrapa Electrones</h1>

    <p>
        Mueve el electrón azul y recoge las cargas amarillas.
    </p>

    <p>
        Puntos: <strong id="score">0</strong>
    </p>

    <div id="gameArea" class="game-area">
        <div id="player" class="player">⚡</div>
        <div id="electron" class="electron"></div>
        <div class="obstacle" style="left: 180px; top: 100px;"></div>
        <div class="obstacle" style="left: 400px; top: 250px;"></div>
        <div class="obstacle" style="left: 80px; top: 320px;"></div>
    </div>

    <div class="controls">
        <button class="control" onclick="move(0, -15)">▲</button><br>
        <button class="control" onclick="move(-15, 0)">◀</button>
        <button class="control" onclick="move(0, 15)">▼</button>
        <button class="control" onclick="move(15, 0)">▶</button>
    </div>

    <p id="message" class="message"></p>

    <button class="button" onclick="restartGame()">
        Reiniciar
    </button>
</main>

<script>
    const player = document.getElementById("player");
    const electron = document.getElementById("electron");
    const gameArea = document.getElementById("gameArea");
    const scoreElement = document.getElementById("score");
    const message = document.getElementById("message");

    let playerX = 20;
    let playerY = 20;
    let score = 0;

    function move(dx, dy) {
        playerX += dx;
        playerY += dy;

        const maxX = gameArea.clientWidth - 35;
        const maxY = gameArea.clientHeight - 35;

        playerX = Math.max(0, Math.min(playerX, maxX));
        playerY = Math.max(0, Math.min(playerY, maxY));

        player.style.left = playerX + "px";
        player.style.top = playerY + "px";

        checkCollision();
    }

    function checkCollision() {
        const electronX = parseInt(electron.style.left || 0);
        const electronY = parseInt(electron.style.top || 0);

        const distance = Math.sqrt(
            Math.pow(playerX - electronX, 2) +
            Math.pow(playerY - electronY, 2)
        );

        if (distance < 35) {
            score++;
            scoreElement.textContent = score;

            electron.style.left =
                Math.floor(Math.random() * (gameArea.clientWidth - 30)) + "px";

            electron.style.top =
                Math.floor(Math.random() * (gameArea.clientHeight - 30)) + "px";

            message.textContent = "✅ ¡Electrón recogido!";
            message.style.color = "#15803d";
        }
    }

    function restartGame() {
        playerX = 20;
        playerY = 20;
        score = 0;

        player.style.left = "20px";
        player.style.top = "20px";

        scoreElement.textContent = "0";
        message.textContent = "";
    }

    document.addEventListener("keydown", event => {
        if (event.key === "ArrowUp" || event.key.toLowerCase() === "w") {
            move(0, -15);
        }

        if (event.key === "ArrowDown" || event.key.toLowerCase() === "s") {
            move(0, 15);
        }

        if (event.key === "ArrowLeft" || event.key.toLowerCase() === "a") {
            move(-15, 0);
        }

        if (event.key === "ArrowRight" || event.key.toLowerCase() === "d") {
            move(15, 0);
        }
    });

    electron.style.left = "300px";
    electron.style.top = "180px";
</script>

</body>
</html>
